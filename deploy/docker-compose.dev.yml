# Local development only. Never deployed: the server's stack is in
# docker-compose.yml and gets its database credentials from /opt/tragni/secrets.
name: tragni-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tragni
      POSTGRES_USER: tragni
      # Development-only. This password protects nothing: the port is bound to
      # the loopback interface and the data is throwaway.
      POSTGRES_PASSWORD: tragni
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tragni -d tragni"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["apps"]
    build:
      context: ../apps/api
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=tragni;Username=tragni;Password=tragni"
    ports:
      - "127.0.0.1:5132:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: "http://api:8080"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
