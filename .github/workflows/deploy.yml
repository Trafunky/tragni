name: Deploy

# Runs only after CI succeeded on main: a failing test has to stop the
# deployment, not merely be visible next to it (Q11).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# Two deployments at once would race each other onto the same server.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit hash is the version: every deployment is traceable to the
      # exact source it was built from, and rolling back is picking an older one.
      - name: API
        run: |
          docker build -t ghcr.io/trafunky/tragni-api:${{ github.event.workflow_run.head_sha }} apps/api
          docker push ghcr.io/trafunky/tragni-api:${{ github.event.workflow_run.head_sha }}

      - name: Web
        run: |
          docker build -t ghcr.io/trafunky/tragni-web:${{ github.event.workflow_run.head_sha }} -f apps/web/Dockerfile .
          docker push ghcr.io/trafunky/tragni-web:${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Migrations are applied as a step of their own, never by the application
      # on startup (ADR-0009). The connection string is unused here: generating
      # the script does not touch a database.
      - name: Generate the migration script
        env:
          ConnectionStrings__Database: Host=not-used
        run: |
          dotnet restore apps/api/Tragni.slnx
          dotnet tool restore
          dotnet ef migrations script --idempotent --project apps/api/src/Tragni.Infrastructure --startup-project apps/api/src/Tragni.Api -o migrate.sql

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy configuration and migration script
        run: |
          scp deploy/docker-compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/tragni/docker-compose.yml
          scp -r deploy/traefik ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/tragni/
          scp migrate.sql ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/migrate.sql

      - name: Migrate and restart
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -euo pipefail <<'REMOTE'
          cd /opt/tragni
          docker compose exec -T postgres sh -c 'PGPASSWORD=$POSTGRES_PASSWORD psql -U tragni -d tragni' < /tmp/migrate.sql
          rm /tmp/migrate.sql
          echo "TRAGNI_VERSION=${{ github.event.workflow_run.head_sha }}" > .env
          docker compose pull
          docker compose up -d
          REMOTE

      # A deployment that produces a broken image has to be visible as a failure,
      # not as a green run with a dead site (arc42 chapter 10).
      - name: Verify
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://tragni.ch/api/status || true)
            if [ "$code" = "200" ]; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "the site did not become healthy"
          exit 1
